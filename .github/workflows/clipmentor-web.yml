name: ClipMentor web

on:
  pull_request:
    paths: ['web/**', 'server/**', 'shared/**', 'src/**', 'config/**', 'desktop/**', 'package*.json', '.github/workflows/clipmentor-web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'shared/**', 'src/**', 'config/**', 'desktop/**', 'package*.json', '.github/workflows/clipmentor-web.yml']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --loglevel=error
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
      - run: npm ci --prefix web
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npx tsx server/clipmentor/task-workspace.verify.ts
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:integration
        working-directory: web
